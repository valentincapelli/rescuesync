# Configuración para tests: base H2 en memoria, no hace falta levantar PostgreSQL
spring:
  application:
    name: rescuesync-sistema-nacional
  datasource:
    url: jdbc:h2:mem:sistema_nacional;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  jackson:
    deserialization:
      fail-on-numbers-for-enums: true

app:
  version: test
  auth:
    cookie-secure: false
  cors:
    allowed-origins: http://localhost:5173

jwt:
  secret: clave-de-prueba-clave-de-prueba-clave-de-prueba-123
  expiration: 3600000
