spring:
  application:
    name: rescuesync-backend

  config:
    # Lee rescuesync-backend/.env si existe (hay que arrancar desde esa carpeta).
    # Las variables de entorno del sistema tienen prioridad sobre el archivo.
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rescuesync}
    username: ${DB_USER:rescuesync}
    password: ${DB_PASSWORD:rescuesync}

  jpa:
    open-in-view: false
    hibernate:
      # update mientras armamos el modelo (E2-03). Pasar a "validate" + migraciones cuando se estabilice.
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${JPA_SHOW_SQL:false}

  jackson:
    time-zone: America/Argentina/Buenos_Aires
    deserialization:
      # Los enums se reciben por nombre; un número no debe interpretarse como su posición.
      fail-on-numbers-for-enums: true

server:
  # Bonita Studio usa el 8080, por eso el backend va en el 8081
  port: ${SERVER_PORT:8081}

app:
  version: '@project.version@'
  cors:
    # Vite (React) corre por defecto en el 5173
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  convocatoria:
    # Duración de la ventana de recepción de ofertas.
    # 172800000 ms = 2 días. Puede sobrescribirse para pruebas.
    plazo-ms: ${PLAZO_CONVOCATORIA_MS:172800000}

bonita:
  base-url: ${BONITA_URL:http://localhost:8080/bonita}
  username: ${BONITA_USER:walter.bates}
  password: ${BONITA_PASSWORD:bpm}
  process-name: ${BONITA_PROCESS:RescueSync}
  # Si Bonita no responde en este tiempo, la llamada falla (evita requests colgados).
  connect-timeout: ${BONITA_CONNECT_TIMEOUT:5s}
  read-timeout: ${BONITA_READ_TIMEOUT:15s}
  despliegues:
    # Habilitar cuando esté desplegado RescueSync 1.2 con la integración E3-10.
    sincronizacion-habilitada: ${BONITA_DESPLIEGUES_SYNC_ENABLED:false}
    intervalo-ms: ${BONITA_DESPLIEGUES_SYNC_INTERVAL_MS:30000}
  seleccion:
    recuperacion-habilitada: ${BONITA_SELECCION_RECOVERY_ENABLED:true}
    intervalo-ms: ${BONITA_SELECCION_RECOVERY_INTERVAL_MS:30000}
    maximo-casos: ${BONITA_SELECCION_RECOVERY_MAX_CASES:20}
  indicadores:
    # Caché por caso de los tiempos por etapa (E4). Los casos archivados no cambian y duran más.
    cache-ttl: ${BONITA_INDICADORES_CACHE_TTL:5m}
    cache-ttl-archivados: ${BONITA_INDICADORES_CACHE_TTL_ARCHIVADOS:12h}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:yJnBNfTcXCeJ5g614Xj11TQlC47tmjHDKDh67o6nlY3}
  expiration: ${JWT_EXPIRATION:86400000}
