# Configuración para tests: base H2 en memoria, no hace falta levantar PostgreSQL
spring:
  application:
    name: rescuesync-backend
  datasource:
    url: jdbc:h2:mem:rescuesync;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  jackson:
    deserialization:
      fail-on-numbers-for-enums: true

app:
  version: test
  cors:
    allowed-origins: http://localhost:5173
  convocatoria:
    plazo-ms: 172800000

bonita:
  base-url: http://localhost:8080/bonita
  username: test
  password: test
  process-name: RescueSync

jwt:
  secret: test-signing-key-for-integration-tests-32bytes
  expiration: 86400000
