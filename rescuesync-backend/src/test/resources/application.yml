# Configuración para tests: base H2 en memoria, no hace falta levantar PostgreSQL
spring:
  application:
    name: rescuesync-backend
  datasource:
    url: jdbc:h2:mem:rescuesync;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

app:
  version: test
  cors:
    allowed-origins: http://localhost:5173

bonita:
  base-url: http://localhost:8080/bonita
  username: test
  password: test
  process-name: RescueSync
