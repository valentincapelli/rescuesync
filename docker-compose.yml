# Base de datos local de RescueSync
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: rescuesync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rescuesync
      POSTGRES_USER: rescuesync
      POSTGRES_PASSWORD: rescuesync
    ports:
      - "5432:5432"
    volumes:
      - rescuesync-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescuesync -d rescuesync"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rescuesync-pgdata:
